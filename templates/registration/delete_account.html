{% extends "base.html" %}
{% block title %}Delete account · Classifieds{% endblock %}
{% block content %}
<h1>Delete your account</h1>
<p>This permanently deletes your account <strong>and every ad you've posted</strong>. It can't be undone.</p>
<form method="post" class="form">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn danger">Delete my account</button>
  <a class="btn secondary" href="{% url 'ads:my_ads' %}">Cancel</a>
</form>
{% endblock %}
