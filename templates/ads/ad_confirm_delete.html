{% extends "base.html" %}
{% block title %}Delete ad · Classifieds{% endblock %}
{% block content %}
<h1>Delete “{{ ad.title }}”?</h1>
<p>This can't be undone.</p>
<form method="post">
  {% csrf_token %}
  <button class="btn danger">Yes, delete it</button>
  <a class="btn secondary" href="{{ ad.get_absolute_url }}">Cancel</a>
</form>
{% endblock %}
